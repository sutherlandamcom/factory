name: PR CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    name: Factory QA & Persistence Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory_test_password
          POSTGRES_DB: factory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: |
          pnpm --filter @factory/site-starter exec playwright install --with-deps chromium
          pnpm --filter @factory/dashboard exec playwright install --with-deps chromium

      - name: Install Vale (pinned, checksum-verified)
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v3.21.0/vale_3.21.0_Linux_64-bit.tar.gz" -o vale.tar.gz
          echo "96997d19a4ca6981673b0d4c5ca7f3ede4a9f97964a96edc29fba9e28a328336  vale.tar.gz" | sha256sum -c -
          tar xzf vale.tar.gz vale && sudo mv vale /usr/local/bin/vale && vale --version

      - name: Validate vendored Vale config compiles (real binary)
        run: vale --config apps/factory/vale/.vale.ini --no-exit --output=JSON apps/factory/vale/ || true

      - name: Run Factory QA (check -> build -> test)
        run: pnpm qa

      - name: Run Persistence Integration Tests (Real PostgreSQL 18)
        env:
          FACTORY_TEST_DATABASE_URL: postgresql://factory:factory_test_password@localhost:5432/factory_test
        run: pnpm --filter @factory/factory run test:persistence

      - name: Run Operator API Security + Preparation Seam Tests (Real PostgreSQL 18)
        env:
          FACTORY_TEST_DATABASE_URL: postgresql://factory:factory_test_password@localhost:5432/factory_test
        run: pnpm --filter @factory/factory run test:operator

      - name: Run Real Browser Operator E2E (built Dashboard + Operator service + PostgreSQL 18)
        env:
          FACTORY_TEST_DATABASE_URL: postgresql://factory:factory_test_password@localhost:5432/factory_test
          FACTORY_OPERATOR_PORT: "4175"
          FACTORY_E2E_SUPERVISOR_PORT: "4177"
        run: pnpm --filter @factory/dashboard run test:e2e

      - name: Run Run 9 Production QA Gates (built-site deterministic QA)
        run: pnpm --filter @factory/factory run test:production

      - name: Run Gitleaks (secret scanning, redacted reporting)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" -o gitleaks.tgz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --redact -v --config .gitleaks.toml

      - name: Run OSV Scanner (dependency vulnerabilities)
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" -o osv-scanner
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan --lockfile=pnpm-lock.yaml || echo "OSV_SCANNER_FINDINGS_PRESENT"

      - name: Run Lychee (broken internal links on built site)
        run: |
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" -o lychee.tgz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tgz" | sha256sum -c -
          tar xzf lychee.tgz
          ./lychee-x86_64-unknown-linux-gnu/lychee --offline --no-progress --root-dir sites/starter/dist 'sites/starter/dist/**/*.html'
