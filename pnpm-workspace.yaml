packages:
  - "apps/*"
  - "packages/*"
  - "sites/*"
allowBuilds:
  # esbuild's postinstall verifies its platform binary (used by tsx/vite).
  '@contentauth/c2pa-node': true
  '@google/genai': true
  esbuild: true
  protobufjs: true
  # Wrangler's pinned workerd runtime verifies its platform binary at install.
  workerd: true
minimumReleaseAgeExclude:
  - astro@7.2.9
overrides:
  tslib@>=1 <2: "2.8.1"
  sharp: "0.35.4"
  js-yaml: "^4.3.2"
  qs: "^6.16.0"
  tmp: "^0.2.7"
  uuid: "^11.1.1"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@puppeteer/browsers": "3.2.2"

