packages:
  - "apps/*"
  - "packages/*"
  - "sites/*"
allowBuilds:
  # esbuild's postinstall verifies its platform binary (used by tsx/vite).
  '@contentauth/c2pa-node': true
  '@google/genai': true
  esbuild: true
  protobufjs: true
  # Wrangler's pinned workerd runtime verifies its platform binary at install.
  workerd: true
minimumReleaseAgeExclude:
  - astro@7.2.9
  - "@modelcontextprotocol/client@2.3.1"
  - basic-ftp@6.2.3
  - brace-expansion@1.1.21
  - devalue@5.9.4
  - zod@4.6.6
  - fast-uri@3.1.9
  - body-parser@1.20.9
  - http-cache-semantics@4.3.0
  - ip-address@10.7.4
  - proxy-addr@2.0.8
  - sharp@0.35.5
  - smol-toml@1.9.1
  - source-map-js@1.2.2
  - undici@7.30.1
  - undici@8.12.2
overrides:
  "@modelcontextprotocol/client": "2.3.1"
  basic-ftp: "6.2.3"
  "brace-expansion@<2": "1.1.21"
  devalue: "5.9.4"
  fast-uri: "3.1.9"
  body-parser: "^1.20.9"
  zod: "4.6.6"
  "@google/design.md>zod": "4.6.6"
  puppeteer-core: "^25.16.0"
  http-cache-semantics: "4.3.0"
  ip-address: "10.7.4"
  proxy-addr: "2.0.8"
  tslib@>=1 <2: "2.8.1"
  sharp: "0.35.5"
  smol-toml: "1.9.1"
  source-map-js: "1.2.2"
  "undici@>=7 <8": "7.30.1"
  "undici@>=8": "8.12.2"
  js-yaml: "^4.3.2"
  qs: "^6.16.0"
  tmp: "^0.2.7"
  uuid: "^11.1.1"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@puppeteer/browsers": "3.2.2"
